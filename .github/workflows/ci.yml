name: CI

# Runs on every push and pull request against main. This formalises the
# check that's been done manually before every deploy this project has
# had so far — a broken build should be caught here, in a few minutes,
# not discovered after Coolify has already deployed it to production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch if a new commit lands —
# no point finishing a check on code that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails fast — typecheck alone catches most real mistakes in under
      # 20 seconds locally, well before the slower full build step below.
      - run: pnpm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pure-function tests only — calculators, rate limiting,
      # pagination, postcode resolution, OpenAPI spec validity. No
      # database, no network, so this runs in a couple of seconds and
      # needs no environment configuration.
      - run: pnpm run test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Standard install — GitHub Actions runners have normal internet
      # access, unlike the sandbox this suite was developed in (which
      # needed an explicit PLAYWRIGHT_EXECUTABLE_PATH workaround,
      # something playwright.config.ts only applies when that specific
      # env var is set, so it's a no-op here).
      - run: npx playwright install --with-deps chromium
        working-directory: apps/marketing

      # Self-contained rather than sharing the build job's output —
      # slightly slower, but avoids a whole class of artifact-passing
      # bugs, and lets this run in parallel with typecheck/test/build
      # instead of waiting on them.
      - run: pnpm run build
        working-directory: apps/marketing

      # Real pages, real HTTP requests, real UI interaction against a
      # genuine built server — see playwright.config.ts and e2e/*.spec.ts
      # for exactly what's covered and what's deliberately left to
      # manual verification against the live site (anything needing a
      # database connection this CI environment doesn't have).
      - run: npx playwright test
        working-directory: apps/marketing

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/marketing/playwright-report/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No DATABASE_URL is set here deliberately — every data-access
      # function in this app is written to fail closed (return empty
      # results, not throw) when the database is unreachable, specifically
      # so the site can build and the public pages still work if the
      # database is briefly down. A CI build with no database configured
      # is a real test of that property, not a workaround for one.
      - run: pnpm run build
